<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Heart Simulator · 심장 시뮬레이터</title>
<style>
  :root {
    --bg: #0b0d17;
    --panel: #151829;
    --accent: #ff3b5c;
    --grid: #1f2336;
    --text: #e8eaf2;
    --muted: #8a90a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% -10%, #1a1d33, var(--bg));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: 0.5px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
  .stage {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 920px;
  }
  .card {
    background: var(--panel);
    border: 1px solid #232742;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .heart-card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  canvas { display: block; border-radius: 12px; }
  .bpm-readout {
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .bpm-readout span { font-size: 1rem; color: var(--muted); font-weight: 400; }
  .status-pill {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    background: #232742;
    color: var(--muted);
  }
  .controls { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 18px; }
  .control-row label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--muted); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .presets button {
    flex: 1;
    min-width: 70px;
    padding: 8px;
    border: 1px solid #2c3150;
    background: #1b1f33;
    color: var(--text);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: 0.15s;
  }
  .presets button:hover { border-color: var(--accent); }
  .presets button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .metric { background: #1b1f33; border-radius: 10px; padding: 10px 12px; }
  .metric .k { font-size: 0.7rem; color: var(--muted); }
  .metric .v { font-size: 1.1rem; font-weight: 600; }
  .toggle-btn {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .toggle-btn.paused { background: #2c3150; }
</style>
</head>
<body>
  <h1>❤️ Heart Simulator</h1>
  <div class="subtitle">뛰는 심장과 실시간 ECG 파형 시뮬레이션</div>

  <div class="stage">
    <div class="card heart-card">
      <canvas id="heart" width="240" height="240"></canvas>
      <div class="bpm-readout"><span id="statusDot">●</span> <span id="bpmVal">72</span><span> BPM</span></div>
      <div class="status-pill" id="statusPill">정상 (Normal)</div>
      <canvas id="ecg" width="320" height="120" style="background:#0a0c16;border:1px solid #1f2336;"></canvas>
    </div>

    <div class="card controls">
      <div class="control-row">
        <label>심박수 (Heart Rate): <strong id="bpmLabel">72</strong> BPM</label>
        <input type="range" id="bpmSlider" min="30" max="200" value="72" />
      </div>

      <div class="control-row">
        <label>프리셋 상태</label>
        <div class="presets" id="presets">
          <button data-bpm="50">휴식 50</button>
          <button data-bpm="72" class="active">정상 72</button>
          <button data-bpm="110">운동 110</button>
          <button data-bpm="160">전력 160</button>
          <button data-bpm="40">서맥 40</button>
        </div>
      </div>

      <div class="metric-grid">
        <div class="metric"><div class="k">RR 간격</div><div class="v" id="rrVal">833 ms</div></div>
        <div class="metric"><div class="k">분당 박출량 (추정)</div><div class="v" id="coVal">5.0 L</div></div>
        <div class="metric"><div class="k">상태</div><div class="v" id="zoneVal">정상</div></div>
        <div class="metric"><div class="k">총 박동 수</div><div class="v" id="beatVal">0</div></div>
      </div>

      <button class="toggle-btn" id="toggleBtn">일시정지</button>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const heartCanvas = document.getElementById("heart");
  const hctx = heartCanvas.getContext("2d");
  const ecgCanvas = document.getElementById("ecg");
  const ectx = ecgCanvas.getContext("2d");

  const bpmSlider = document.getElementById("bpmSlider");
  const bpmLabel = document.getElementById("bpmLabel");
  const bpmVal = document.getElementById("bpmVal");
  const rrVal = document.getElementById("rrVal");
  const coVal = document.getElementById("coVal");
  const zoneVal = document.getElementById("zoneVal");
  const beatVal = document.getElementById("beatVal");
  const statusPill = document.getElementById("statusPill");
  const statusDot = document.getElementById("statusDot");
  const toggleBtn = document.getElementById("toggleBtn");
  const presetButtons = [...document.querySelectorAll("#presets button")];

  const state = {
    bpm: 72,
    running: true,
    phase: 0,        // 0..1 within a cardiac cycle
    beats: 0,
    ecg: new Array(ecgCanvas.width).fill(0),
  };

  // --- Heart shape drawing -------------------------------------------------
  function heartPath(ctx, cx, cy, size) {
    ctx.beginPath();
    for (let t = 0; t <= Math.PI * 2; t += 0.01) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t)
              - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const px = cx + x * size;
      const py = cy - y * size;
      if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // Systole pulse: sharp contraction then relaxation, derived from phase.
  function pulseScale(phase) {
    // Two quick contractions per cycle (atrial + ventricular feel)
    const p = phase;
    let s = 0;
    if (p < 0.12) s = Math.sin((p / 0.12) * Math.PI) * 0.18;       // P-ish bump
    else if (p < 0.30) s = Math.sin(((p - 0.12) / 0.18) * Math.PI) * 0.42; // main beat
    return s;
  }

  function drawHeart() {
    const w = heartCanvas.width, h = heartCanvas.height;
    hctx.clearRect(0, 0, w, h);
    const scale = pulseScale(state.phase);
    const base = 5.6;
    const size = base * (1 + scale);

    // glow
    const grad = hctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, 130);
    grad.addColorStop(0, `rgba(255,59,92,${0.35 + scale})`);
    grad.addColorStop(1, "rgba(255,59,92,0)");
    hctx.fillStyle = grad;
    hctx.fillRect(0, 0, w, h);

    heartPath(hctx, w/2, h/2 + 10, size);
    const fill = hctx.createLinearGradient(0, 40, 0, 210);
    fill.addColorStop(0, "#ff6178");
    fill.addColorStop(1, "#c4112f");
    hctx.fillStyle = fill;
    hctx.fill();
    hctx.lineWidth = 2;
    hctx.strokeStyle = "rgba(255,255,255,0.25)";
    hctx.stroke();
  }

  // --- ECG waveform (PQRST) ------------------------------------------------
  function ecgValue(phase) {
    const p = phase;
    const g = (center, width, amp) =>
      amp * Math.exp(-Math.pow((p - center) / width, 2));
    let v = 0;
    v += g(0.10, 0.020, 0.15);   // P wave
    v -= g(0.225, 0.008, 0.10);  // Q
    v += g(0.250, 0.007, 1.00);  // R spike
    v -= g(0.275, 0.010, 0.25);  // S
    v += g(0.40, 0.035, 0.30);   // T wave
    return v;
  }

  function drawECG() {
    const w = ecgCanvas.width, h = ecgCanvas.height;
    ectx.fillStyle = "#0a0c16";
    ectx.fillRect(0, 0, w, h);

    // grid
    ectx.strokeStyle = "#161a2c";
    ectx.lineWidth = 1;
    for (let x = 0; x < w; x += 20) {
      ectx.beginPath(); ectx.moveTo(x, 0); ectx.lineTo(x, h); ectx.stroke();
    }
    for (let y = 0; y < h; y += 20) {
      ectx.beginPath(); ectx.moveTo(0, y); ectx.lineTo(w, y); ectx.stroke();
    }

    // trace
    ectx.strokeStyle = "#36ff8b";
    ectx.lineWidth = 2;
    ectx.beginPath();
    const mid = h * 0.6;
    for (let x = 0; x < w; x++) {
      const y = mid - state.ecg[x] * (h * 0.45);
      if (x === 0) ectx.moveTo(x, y); else ectx.lineTo(x, y);
    }
    ectx.stroke();
  }

  // --- Status zones --------------------------------------------------------
  function classify(bpm) {
    if (bpm < 60) return { label: "서맥 (Bradycardia)", short: "서맥", color: "#5b9bff" };
    if (bpm <= 100) return { label: "정상 (Normal)", short: "정상", color: "#36ff8b" };
    if (bpm <= 150) return { label: "빈맥 (Tachycardia)", short: "빈맥", color: "#ffb13b" };
    return { label: "위험 빈맥 (High)", short: "위험", color: "#ff3b5c" };
  }

  function updateReadouts() {
    const bpm = state.bpm;
    const rr = Math.round(60000 / bpm);
    bpmVal.textContent = bpm;
    bpmLabel.textContent = bpm;
    rrVal.textContent = rr + " ms";
    // Cardiac output estimate: SV ~70ml, drops slightly at very high rates
    const sv = bpm > 150 ? 55 : 70;
    coVal.textContent = ((bpm * sv) / 1000).toFixed(1) + " L";
    const c = classify(bpm);
    zoneVal.textContent = c.short;
    statusPill.textContent = c.label;
    statusPill.style.color = c.color;
    statusDot.style.color = c.color;
  }

  // --- Animation loop ------------------------------------------------------
  let last = performance.now();
  function loop(now) {
    const dt = (now - last) / 1000;
    last = now;

    if (state.running) {
      const cycleDur = 60 / state.bpm; // seconds per beat
      const prevPhase = state.phase;
      state.phase += dt / cycleDur;
      if (state.phase >= 1) {
        state.phase -= 1;
        state.beats++;
        beatVal.textContent = state.beats;
      }

      // advance ECG buffer: pixels per second tied to ~ fixed sweep
      const pxPerSec = 90;
      const advance = Math.max(1, Math.round(pxPerSec * dt));
      for (let i = 0; i < advance; i++) {
        state.ecg.shift();
        state.ecg.push(ecgValue(state.phase));
      }
    }

    drawHeart();
    drawECG();
    requestAnimationFrame(loop);
  }

  // --- Events --------------------------------------------------------------
  function setBpm(v) {
    state.bpm = Math.round(v);
    bpmSlider.value = state.bpm;
    presetButtons.forEach(b => b.classList.toggle("active", +b.dataset.bpm === state.bpm));
    updateReadouts();
  }

  bpmSlider.addEventListener("input", e => setBpm(+e.target.value));
  presetButtons.forEach(b => b.addEventListener("click", () => setBpm(+b.dataset.bpm)));
  toggleBtn.addEventListener("click", () => {
    state.running = !state.running;
    toggleBtn.textContent = state.running ? "일시정지" : "재생";
    toggleBtn.classList.toggle("paused", !state.running);
  });

  updateReadouts();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
